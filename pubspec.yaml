name: nullgram
description: "nullgram"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: 3.41.9

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_info_plus: ^12.1.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  rxdart: ^0.28.0
  logger: ^2.6.2
  flutter_dotenv: ^6.0.0
  share_plus: ^12.0.0
  intl: ^0.20.2
  record: ^6.1.2
  just_audio: ^0.10.5
  video_player: ^2.11.1
  flutter_local_notifications: ^21.0.0
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  ntgcalls_flutter: ^1.0.0
  url_launcher: ^6.3.2
  dynamic_color: ^1.8.1
  lottie: ^3.3.3
  flutter_animate: ^4.5.2
  gal: ^2.3.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.2
  local_auth: ^3.0.2
  crypto: ^3.0.7
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  ntgcalls_flutter:
    path: ../../Dart/tgcalls

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/
    - assets/lottie/
